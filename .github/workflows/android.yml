name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "TSViewer.html", "examples/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "TSViewer.html", "examples/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_UPLOAD_KEY: ${{ secrets.TSV_KEYSTORE_B64 != '' }}
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Installable test build: sideload it with "Install unknown apps".
      - name: Build debug APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tsviewer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Release bundle for Google Play, plus a release APK for GitHub releases.
      # Signed here when the TSV_* upload-key secrets exist; otherwise both are
      # built unsigned.
      - name: Build release bundle and APK
        env:
          TSV_KEYSTORE_B64: ${{ secrets.TSV_KEYSTORE_B64 }}
          TSV_KEYSTORE_PASSWORD: ${{ secrets.TSV_KEYSTORE_PASSWORD }}
          TSV_KEY_ALIAS: ${{ secrets.TSV_KEY_ALIAS }}
          TSV_KEY_PASSWORD: ${{ secrets.TSV_KEY_PASSWORD }}
        run: |
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            echo "$TSV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export TSV_KEYSTORE="$RUNNER_TEMP/upload.jks"
          fi
          gradle -p android bundleRelease assembleRelease
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: tsviewer-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # Main-branch builds also go to a private draft release, so the bundle can be
      # fetched without Actions artifact access. Drafts are visible only to maintainers.
      - name: Attach bundle to a draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="play-build-${{ github.run_number }}"
          cp android/app/build/outputs/bundle/release/app-release.aab "tsviewer-${tag}.aab"
          gh release create "$tag" "tsviewer-${tag}.aab" --draft --target "${{ github.sha }}" \
            --title "TSViewer Play build ${{ github.run_number }}" \
            --notes "versionCode ${{ github.run_number }}. Upload key signed: $HAS_UPLOAD_KEY."

      # Main-branch builds that are signed with the upload key go straight to Play's
      # closed testing (alpha) track as a draft release. Sending it for review stays manual.
      - name: Upload bundle to Google Play closed testing
        if: github.event_name != 'pull_request' && env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vecbandz.tsviewer
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: alpha
          status: draft

      # Main-branch builds signed with the upload key are also published as a public
      # GitHub release with the APK attached, for people who install outside Google Play.
      # Marked not-latest so the "latest release" link keeps pointing at the Termux zip.
      # Runs after the Play upload so a problem here never holds Play back.
      - name: Publish APK as a GitHub release
        if: github.event_name != 'pull_request' && env.HAS_UPLOAD_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          tag="android-v${version_name}-build${VERSION_CODE}"
          apk="TSViewer-${version_name}-build${VERSION_CODE}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          printf '%s\n' \
            "TSViewer for Android ${version_name}, build ${VERSION_CODE}." \
            "" \
            "To install: download the APK on your phone, open it, and allow installs from your browser or file manager when Android asks." \
            "" \
            "This APK is signed with the developer's key, not Google Play's. If you already have TSViewer from Google Play, uninstall it first; the two can't update each other." \
            "" \
            "SHA-256: \`${sum}\`" > notes.md
          gh release create "$tag" "$apk" --target "${{ github.sha }}" --latest=false \
            --title "TSViewer for Android ${version_name} (build ${VERSION_CODE})" \
            --notes-file notes.md
