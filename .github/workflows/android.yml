name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "TSViewer.html", "examples/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "TSViewer.html", "examples/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_UPLOAD_KEY: ${{ secrets.TSV_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Installable test build: sideload it with "Install unknown apps".
      - name: Build debug APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tsviewer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Signed bundle for Google Play. Needs the four TSV_* repository secrets.
      - name: Build signed release bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          TSV_KEYSTORE_B64: ${{ secrets.TSV_KEYSTORE_B64 }}
          TSV_KEYSTORE_PASSWORD: ${{ secrets.TSV_KEYSTORE_PASSWORD }}
          TSV_KEY_ALIAS: ${{ secrets.TSV_KEY_ALIAS }}
          TSV_KEY_PASSWORD: ${{ secrets.TSV_KEY_PASSWORD }}
        run: |
          echo "$TSV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export TSV_KEYSTORE="$RUNNER_TEMP/upload.jks"
          gradle -p android bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: tsviewer-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: No upload key yet
        if: env.HAS_UPLOAD_KEY != 'true'
        run: echo "::notice::Skipped the Play bundle. Add the TSV_KEYSTORE_B64, TSV_KEYSTORE_PASSWORD, TSV_KEY_ALIAS and TSV_KEY_PASSWORD secrets to build it."
