<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tsviewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header band with title and stats, a 10% rail of numbered pills on the left, a scrolling reader on the right. */
:root{
  --bg:#f4f6f7;--panel:#ffffff;--fg:#13212b;--mut:#586873;--bd:#d9e0e4;
  --acc:#0b7a75;--acc-soft:#dcf0ee;--ok:#2a7a3b;--err:#b42318;--code:#eaeff1;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171d;--panel:#16222a;--fg:#e5edf1;--mut:#92a3ae;--bd:#293945;
  --acc:#3cc6bd;--acc-soft:#16393a;--ok:#6cc487;--err:#f4807a;--code:#0c1318;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d;--panel:#16222a;--fg:#e5edf1;--mut:#92a3ae;--bd:#293945;
  --acc:#3cc6bd;--acc-soft:#16393a;--ok:#6cc487;--err:#f4807a;--code:#0c1318;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);
  display:flex;flex-direction:column;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* header */
header{flex:none;display:flex;flex-direction:column;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 24px}
.ident{display:flex;flex-direction:column;gap:10px;min-width:0}
h1{margin:0;font-size:22px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--mut);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.controls select,.controls input{min-width:0;height:36px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--panel)}
.controls select{max-width:260px}
.controls input{width:200px}
.stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 22px;margin:0;max-width:560px;min-width:0}
.stat{display:flex;flex-direction:column;min-width:0}
.stat dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.stat dd{margin:0;font:500 15px/1.35 var(--mono);font-variant-numeric:tabular-nums}
.stat dd.bad{color:var(--err)}

/* app: rail + reader */
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(92px,10%) minmax(0,1fr);gap:12px}
.rail{min-height:0;min-width:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;
  background:var(--panel);border:1px solid var(--bd);border-radius:12px}
.pill{flex:none;display:flex;flex-direction:column;gap:1px;padding:6px 10px;text-align:left;cursor:pointer;
  border:1px solid var(--bd);border-radius:16px;background:var(--bg)}
.pill:hover{border-color:var(--acc)}
.pill[aria-current="true"]{background:var(--acc-soft);border-color:var(--acc)}
.pill .l1{display:flex;align-items:center;gap:6px;font:500 13px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.pill .l2{font:400 11px/1.3 var(--mono);color:var(--mut);font-variant-numeric:tabular-nums}
.k{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font:600 10px/1 var(--mono);
  color:var(--panel);background:var(--mut)}
.k-u{background:var(--acc)}
.k-c{background:var(--fg)}
.k-ok{background:var(--ok)}
.k-bad{background:var(--err)}

.reader{min-height:0;min-width:0;overflow-y:auto;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:0 20px 28px}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 0;margin-bottom:12px;background:var(--panel);border-bottom:1px solid var(--bd)}
.crumb{display:flex;flex-wrap:wrap;gap:4px 12px;font:400 12px/1.4 var(--mono);color:var(--mut);font-variant-numeric:tabular-nums}
.crumb b{color:var(--fg);font-weight:500}
.nav{display:flex;gap:6px}
.nav button{height:32px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);cursor:pointer}
.nav button:hover:not(:disabled){border-color:var(--acc)}
.nav button:disabled{opacity:.4;cursor:default}
article{max-width:74ch}
.who{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--acc)}
.who.c{color:var(--mut)}
.body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmd{display:flex;flex-direction:column;gap:10px}
.cmd .row{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 12px/1.4 var(--mono);color:var(--mut)}
.cmd .row .bad{color:var(--err);font-weight:500}.cmd .row .ok{color:var(--ok);font-weight:500}
pre{margin:0;padding:10px 12px;border-radius:8px;background:var(--code);font:400 13px/1.5 var(--mono);
  white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;overflow-x:auto}
pre.err{color:var(--err)}
.empty{color:var(--mut);padding:24px 0}

@media (max-width:640px){
  html,body{height:auto}
  body{font-size:17px;gap:10px;padding-block:10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));min-height:100dvh}
  h1{font-size:24px}
  .sub{font-size:14px}
  .controls{width:100%;flex-direction:column}
  .controls select,.controls input{width:100%;max-width:none;height:48px;font-size:16px;border-radius:10px}
  .stats{justify-content:flex-start;max-width:none;flex-wrap:nowrap;overflow-x:auto;gap:18px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .stat{flex:none}
  .stat dt{font-size:12px}
  .stat dd{font-size:17px}
  .app{display:flex;flex-direction:column;gap:10px;flex:1}
  .rail{flex:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;gap:8px;-webkit-overflow-scrolling:touch}
  .pill{min-width:76px;min-height:56px;justify-content:center;padding:8px 12px;border-radius:14px}
  .pill .l1{font-size:17px;gap:8px}
  .pill .l2{font-size:14px}
  .k{width:22px;height:22px;font-size:13px}
  .reader{flex:1;overflow:visible;padding:0 16px 28px}
  .bar{top:0;padding:10px 0;margin-bottom:14px;flex-direction:column;align-items:stretch;gap:10px}
  .crumb{font-size:14px}
  .nav{gap:10px}
  .nav button{flex:1;height:48px;font-size:16px;border-radius:10px}
  article{max-width:none}
  .who{font-size:13px}
  .body{font-size:17px;line-height:1.6}
  .cmd .row{font-size:14px}
  pre{font-size:14px;padding:12px}
}
</style>

<header>
  <div class="top">
    <div class="ident">
      <div>
        <h1>tsviewer</h1>
        <p class="sub">Notes, commands and conversation from each recorded session</p>
      </div>
      <div class="controls">
        <select id="sess" aria-label="Session"></select>
        <input id="q" type="search" placeholder="Filter entries" aria-label="Filter entries">
      </div>
    </div>
    <dl class="stats" id="stats"></dl>
  </div>
</header>
<div class="app">
  <nav class="rail" id="rail" aria-label="Entries"></nav>
  <main class="reader" id="reader" tabindex="-1"></main>
</div>

<script>
const D=__DATA__;
const $=id=>document.getElementById(id);
const sess=$('sess'),q=$('q'),rail=$('rail'),reader=$('reader'),statsEl=$('stats');
const names=Object.keys(D);
let cur=names[names.length-1],idx=0;

const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const time=ts=>ts?String(ts).slice(11,19):'';
const day=ts=>ts?String(ts).slice(0,10):'';
function parse(e){
  if(e.type==='note'){
    const m=/^(User|Claude): ([\s\S]*)$/.exec(e.text||'');
    if(m)return{kind:m[1]==='User'?'u':'c',who:m[1],body:m[2]};
    return{kind:'n',who:'Note',body:e.text||''};
  }
  return{kind:e.exit?'bad':'ok',who:'Command',body:e.cmd||''};
}
const glyph={u:'U',c:'C',n:'N',ok:'$',bad:'!'};
const events=()=>D[cur]||[];

function span(list){
  if(!list.length)return'none';
  const a=list[0].ts,b=list[list.length-1].ts;
  const d=a.slice(0,10)===b.slice(0,10)?day(a):day(a)+' → '+day(b);
  return d+' · '+time(a).slice(0,5)+'–'+time(b).slice(0,5);
}
function renderStats(){
  const ev=events(),total=names.reduce((n,k)=>n+D[k].length,0);
  const cmds=ev.filter(e=>e.type==='command'),fails=cmds.filter(e=>e.exit).length;
  const talk=ev.filter(e=>parse(e).kind==='u'||parse(e).kind==='c').length;
  const items=[['Sessions',names.length],['All entries',total],['This session',ev.length],
    ['Conversation',talk],['Commands',cmds.length],['Failed',fails,fails?'bad':''],['Span',span(ev)]];
  statsEl.innerHTML=items.map(([k,v,c])=>`<div class="stat"><dt>${k}</dt><dd class="${c||''}">${esc(v)}</dd></div>`).join('');
}
function renderRail(){
  rail.innerHTML=events().map((e,i)=>{
    const p=parse(e);
    return`<button class="pill" type="button" data-i="${i}" title="${esc(p.body.slice(0,90))}" aria-current="${i===idx}">`+
      `<span class="l1"><span class="k k-${p.kind}" aria-hidden="true">${glyph[p.kind]}</span>${i+1}</span>`+
      `<span class="l2">${esc(time(e.ts).slice(0,5))}</span></button>`;
  }).join('');
  applyFilter();
}
function matches(e,f){return !f||JSON.stringify(e).toLowerCase().includes(f)}
function applyFilter(){
  const f=q.value.trim().toLowerCase();
  [...rail.children].forEach((b,i)=>{b.hidden=!matches(events()[i],f)});
}
function visible(i){const b=rail.children[i];return b&&!b.hidden}
function renderReader(){
  const ev=events(),e=ev[idx];
  if(!e){reader.innerHTML='<p class="empty">No entries yet. Log one with: python3 tlog.py note my-session "hello"</p>';return}
  const p=parse(e);
  const bar=`<div class="bar"><div class="crumb"><b>Entry ${idx+1} of ${ev.length}</b><span>${esc(day(e.ts))} ${esc(time(e.ts))}</span><span>${esc(e.type+(e.via?' · '+e.via:''))}</span></div>`+
    `<div class="nav"><button type="button" id="prev">Previous</button><button type="button" id="next">Next</button></div></div>`;
  let body;
  if(e.type==='command'){
    body=`<div class="cmd"><div class="row"><span>via ${esc(e.via||'run')}</span><span class="${e.exit?'bad':'ok'}">exit ${esc(e.exit)}</span></div>`+
      `<pre>$ ${esc(e.cmd)}</pre>`+(e.stdout?`<pre>${esc(e.stdout)}</pre>`:'')+(e.stderr?`<pre class="err">${esc(e.stderr)}</pre>`:'')+`</div>`;
  }else{
    body=`<p class="who ${p.kind==='c'?'c':''}">${esc(p.who)}</p><p class="body">${esc(p.body)}</p>`;
  }
  reader.innerHTML=bar+`<article>${body}</article>`;
  $('prev').disabled=step(-1)===idx;
  $('next').disabled=step(1)===idx;
  $('prev').onclick=()=>show(step(-1));
  $('next').onclick=()=>show(step(1));
}
function step(d){
  let j=idx+d;
  while(j>=0&&j<events().length){if(visible(j))return j;j+=d}
  return idx;
}
function show(i){
  idx=i;
  [...rail.children].forEach((b,k)=>b.setAttribute('aria-current',String(k===idx)));
  const b=rail.children[idx];
  if(b)b.scrollIntoView({block:'nearest',inline:'nearest'});
  renderReader();
  reader.scrollTop=0;
}
function load(name){cur=name;idx=0;renderStats();renderRail();show(0)}

names.forEach(k=>sess.add(new Option(k+' ('+D[k].length+')',k)));
sess.value=cur;
sess.onchange=()=>load(sess.value);
q.oninput=()=>{applyFilter();$('prev')&&renderReader()};
rail.onclick=ev=>{const b=ev.target.closest('.pill');if(b)show(+b.dataset.i)};
document.addEventListener('keydown',ev=>{
  if(ev.target.matches('input,select')||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  if(ev.key==='ArrowDown'||ev.key==='j'){ev.preventDefault();show(step(1))}
  if(ev.key==='ArrowUp'||ev.key==='k'){ev.preventDefault();show(step(-1))}
});
load(cur);
</script>
